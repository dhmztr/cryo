[package]
name = "cryoarc"
version = "0.1.1"
edition = "2024"
description = "Block-based archive tool with zstd compression and optional AES-256-GCM or ChaCha20-Poly1305 encryption"
license = "Apache-2.0"
repository = "https://github.com/dhmztr/cryo"
keywords = ["archive", "compression", "encryption", "zstd"]
categories = ["command-line-utilities", "compression", "cryptography"]

[[bin]]
name = "cryo"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.0"
argon2 = "0.5.3"
clap = { version = "4.6.1", features = ["derive"] }
rpassword = "7.5.4"
uuid = { version = "1.24.0", features = ["v4"] }
zstd = "0.13.3"
rand_core = { version = "0.6.4", features = ["std"] }
aes = "0.9.1"
chacha20poly1305 = "0.11.0"
blake3 = "1.8.5"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
indicatif = "0.17"
bytesize = "2.7.0"
globset = "0.4.19"
rayon = "1.12.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
